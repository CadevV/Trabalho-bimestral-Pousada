        <section class="contatoFormSecao">
            <form action="" method="post" class="escolhaForm">
              <h2>Escolha sobre o que deseja falar</h2>

                <div class="escolhaDecisao">
                  <input type="checkbox"> <span>Atrações</span>
                  <input type="checkbox"> <span>Acomodações</span>
                  <input type="checkbox"> <span>Home</span>
                  <input type="checkbox"> <span>Outro</span>

              <h2>Escolha uma nova experiência:</h2>
              
              <div>

          <form action="" method="post" class="contatoForm">
            <h1>Fale conosco!</h1>

            <div class="unico">
              <label for="">Primeiro nome</label>
              <input type="text" placeholder="Ex: Carlos">
            </div>

            <div class="unico">
              <label for="">Segundo nome</label>
              <input type="text" placeholder="Ex: Silva">
            </div>

            <div class="unico">
              <label for="">Email</label>
              <input type="email" placeholder="Ex: Email@gmail.com">
            </div>

            <div class="unico">
              <label for="">Data de nascimento</label>
              <input type="date">
            </div>

            <div class="duplo">
              <label for="">Telefone</label>
              <input type="tel" placeholder="Ex: 99999-9999">

              <label for="">CPF</label>
              <input type="number" placeholder="Ex: 111.111.111-11">
            </div>

            <div class="unicoCom">
              <label for="">Comentario:</label>
              <textarea name="" id="comentario" placeholder="Escreva seu comentario aqui"></textarea>
            </div>

            <button type="submit">Enviar</button>
